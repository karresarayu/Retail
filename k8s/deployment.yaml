
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailpulse
  labels:
    app: retailpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retailpulse
  template:
    metadata:
      labels:
        app: retailpulse
    spec:
      containers:
        - name: retailpulse
          image: YOUR_DOCKERHUB_USERNAME/retailpulse:latest
          ports:
            - containerPort: 8501
          readinessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10

